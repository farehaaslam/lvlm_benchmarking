
[project]
name = "lvlm-benchmarking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "accelerate>=1.15.0",
    "decord>=0.6.0",
    "gdown>=6.4.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

# PyTorch CUDA 12.9 package index
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# Install these packages from the CUDA-specific index
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }