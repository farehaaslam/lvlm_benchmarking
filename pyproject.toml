[project]
name = "lvlm-benchmarking"
version = "0.1.0"
description = "Qwen3-VL-32B video QA with plain HF transformers (no vLLM)"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Only what qwen32.py and the dataset download scripts need.
dependencies = [
    "torch==2.13.0",
    # Qwen3-VL video processor resizes frames with torchvision
    "torchvision==0.28.0",
    "transformers>=5.10.4",
    # device_map="auto"
    "accelerate",
    # video frame decoding in qwen32.py
    "decord>=0.6.0",
    # download_dataset.py / download_video.py
    "gdown>=6.4.0",
    "pandas",
]

[tool.uv]
# Only resolve for Linux x86_64 (the GPU instance)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Driver supports up to CUDA 12.9 -> use cu129 builds, not the default CUDA 13 ones
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
