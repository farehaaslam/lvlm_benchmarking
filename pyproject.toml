[project]
name = "lvlm-benchmarking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "vllm==0.30.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "transformers>=5.10.4",
    "accelerate",
    "decord>=0.6.0",
    "torchcodec>=0.14",
    "gdown>=6.4.0",
    # headless: vLLM already pulls this one; the GUI build would clash with
    # it and needs libGL, which vast.ai images usually don't have
    "opencv-python-headless",
    "pandas",
    "tqdm",
    "pyarrow>=25.0.1",
]

[tool.uv]
# Only resolve for Linux x86_64 (the vLLM CUDA 12.9 wheel is x86_64-only)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Driver supports up to CUDA 12.9 -> use cu129 builds, not the default CUDA 13 ones
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
